# Netlify. Connect the repo in the dashboard; these settings are picked up
# automatically, so there's nothing to configure in the UI.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# `trailingSlash: true` in next.config.ts means Netlify resolves directories
# correctly on its own. This catch-all only handles genuinely missing paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
