<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A pulse trace: legible at 16px, and it points at the work (real-time
    signal systems) rather than being a generic monogram. Solid accent fill so
    it holds up against both light and dark browser chrome.
  -->
