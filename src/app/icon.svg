  <path
    d="M5 16h5l2.5-6.5L17 22.5l2.5-6.5H27"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
