# Builds the static site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
#
# If you serve from a project subpath (user.github.io/repo-name) rather than a
# custom domain, set NEXT_PUBLIC_BASE_PATH to "/repo-name" in the build step.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI can't drift from local.
      - run: npm ci

      # Fails the build on a bad frontmatter field or a type error, which is
      # the whole point of validating content at build time.
      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
